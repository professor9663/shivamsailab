 for(let yy=y+14;yy<636;yy+=cell*1.7)for(let xx=x+8;xx<x+w-cell;xx+=cell*1.6)if(rn()<lit){g.fillStyle=rn()<.3?'#ffe3a0':'#ffb25a';g.fillRect(xx,yy,cell,cell*1.1)}

box(.08,1.7,.06,M(0x0d1020),-3.04,2.3,-2.5);box(.08,1.7,.06,M(0x0d1020),-.36,2.3,-2.5);box(.06,1.6,.06,M(0x0d1020),-1.7,2.3,-2.5);

box(3.4,.08,1.3,M(0x0e1020,{roughness:.25,metalness:.4}),0,.78,0);

 if(key==='about'){T.textContent='aira — about & chat';let tab='about';
  const draw=()=>{X.innerHTML=`<span class="tabs"><button class="chip ${tab==='chat'?'on':''}" data-t="chat">CHAT</button><button class="chip ${tab==='about'?'on':''}" data-t="about">ABOUT</button></span>`;
   $$('.tabs .chip').forEach(c=>c.onclick=()=>{tab=c.dataset.t;airaMode='focus';draw()});
   if(tab==='about'){const sk=Object.entries(DATA.skills);b.innerHTML=`<div style="max-width:680px;margin:auto"><h2 style="font-size:32px">Shivam Shukla</h2><p style="color:var(--rose);font-family:var(--mono);margin:6px 0 18px">AI ENGINEER</p>${DATA.about?`<p style="line-height:1.7">${e(DATA.about)}</p>`:empty('Introduction not added yet','Set <code>DATA.about</code> with your own words.')}${sk.map(([k,v])=>`<h3 style="margin:20px 0 8px">${e(k)}</h3><div class="tags">${v.map(x=>`<span>${e(x)}</span>`).join('')}</div>`).join('')}${DATA.resume?`<p class="links"><a href="${e(DATA.resume)}" target="_blank" rel="noopener">Download resume</a></p>`:''}</div>`}
   else{b.innerHTML=`<div class="chat"><div class="log" id="lg"><div class="bub">Hi, I’m AIRA, Shivam’s virtual assistant. Ask me about his work.</div></div><div class="row"><input id="ci" placeholder="Type a message" aria-label="Message"><button id="cs">Send</button></div></div>`;
    const send=()=>{const i=$('#ci'),q=i.value.trim();if(!q)return;i.value='';const lg=$('#lg');lg.insertAdjacentHTML('beforeend',`<div class="bub u">${e(q)}</div>`);airaMode='think';
     setTimeout(()=>{airaMode='speak';lg.insertAdjacentHTML('beforeend','<div class="bub">The AI service isn’t connected in this build, so I can’t answer yet. It needs a server-side <code>/api/chat</code> endpoint with a Gemini or OpenAI key. API keys must never go in the browser.</div>');lg.scrollTop=lg.scrollHeight;setTimeout(()=>airaMode='focus',1500)},700)};
    $('#cs').onclick=send;$('#ci').onkeydown=ev=>{if(ev.key==='Enter')send()};$('#ci').focus()}};draw()}}

let clock=null;
function renderProjects(b,T,X){clearInterval(clock);T.textContent='projects — developer workspace';
 const cats=['All Projects','AI / ML','Generative AI','Web Development','Python','Other'],P=DATA.projects;let f=cats[0],sel=0,det=false;
 const W=(t,c)=>`<section class="dk-w"><header><i></i><i></i><i></i>${t}</header><div>${c}</div></section>`;
 const lk=p=>(p.github?`<a href="${e(p.github)}" target="_blank" rel="noopener">GitHub</a> `:'')+(p.demo?`<a href="${e(p.demo)}" target="_blank" rel="noopener">Live demo</a>`:'');
 const tg=p=>(p.tech||[]).map(x=>`<span>${e(x)}</span>`).join('');
 const none='<span style="color:#9a9cbc">Nothing here yet. Add real entries to <code>DATA.projects</code>.</span>';
 const tick=()=>{const c=$('#dkc');if(c)c.textContent=new Date().toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
 const draw=()=>{const L=P.filter(p=>f===cats[0]||p.category===f);sel=Math.min(sel,Math.max(L.length-1,0));const p=L[sel];X.textContent=L.length+' shown';
  const top=`<div class="dk-top"><b>shivam@lab</b>${cats.map(c=>`<button class="chip ${c===f?'on':''}" data-c="${c}">${c}</button>`).join('')}<span class="sp"></span><span>${P.length} projects</span><span>● visitor</span><span id="dkc"></span></div>`;
  if(det&&p)b.innerHTML=top+W('project — '+e(p.name),`<h2>${e(p.name)}</h2><div class="tags"><span>${e(p.category)}</span><span>${e(p.status)}</span></div>${p.image?`<img class="pv" src="${e(p.image)}" alt="${e(p.name)} screenshot">`:''}<p>${e(p.description)}</p><div class="tags">${tg(p)}</div><div class="tags">${lk(p)}</div><button class="back" data-b>◂ ALL PROJECTS</button>`);
  else b.innerHTML=top+'<div class="dk-grid">'+
   W('featured',p?`<h3>${e(p.name)}</h3><p>${e(p.description)}</p><button class="back" data-o>VIEW PROJECT</button>`:none)+
   W('preview',p?(p.image?`<img class="pv" data-o src="${e(p.image)}" alt="${e(p.name)} preview">`:`<button class="pv" data-o>${e(p.name)}</button>`):none)+
   W('tech',p?`<div class="tags"><span>${e(p.category)}</span><span>${e(p.status)}</span></div><div class="tags">${tg(p)}</div><div class="tags">${lk(p)||'<span>No links configured</span>'}</div>`:none)+
   W('terminal',`<div class="term"><span>shivam@lab</span> ~ $ fetch<br>role AI Engineer<br>owner Shivam Shukla<br>projects ${P.length}<br>skill groups ${Object.keys(DATA.skills).length}<br><span>shivam@lab</span> ~ $ ▮</div>`)+
   W('workspace',L.length?L.map((q,i)=>`<button class="file ${i===sel?'on':''}" data-i="${i}">▸ ${e(q.name)}</button>`).join(''):none)+
   W('skills',Object.keys(DATA.skills).length?Object.entries(DATA.skills).map(([k,v])=>`<b>${e(k)}</b><div class="tags">${v.map(x=>`<span>${e(x)}</span>`).join('')}</div>`).join(''):'<span style="color:#9a9cbc">No skills added yet.</span>')+'</div>';
  $$('[data-c]').forEach(c=>c.onclick=()=>{f=c.dataset.c;sel=0;det=false;draw()});$$('[data-i]').forEach(c=>c.onclick=()=>{sel=+c.dataset.i;draw()});$$('[data-o]').forEach(c=>c.onclick=()=>{det=true;draw()});const bk=$('[data-b]');if(bk)bk.onclick=()=>{det=false;draw()};tick()};
 draw();clock=setInterval(tick,1000)}
/* ===== INTRO ===== */
let soundOn=false;
/* original synthesized sound design (Web Audio, no external files); opt-in only */
const SFX=(()=>{let c,ab,ub,wn,amb,on=false;const nv=(k,d)=>{const v=store.get(k);return v===null?d:+v};let va=nv('lab-va',.5),vu=nv('lab-vu',.6);
 const noise=(s,brown)=>{const r=c.sampleRate,N=Math.floor(r*s),X=Math.floor(r*.5),d=new Float32Array(N);let l=0;for(let i=0;i<N;i++){const w=Math.random()*2-1;l=brown?(l+.02*w)/1.02:w;d[i]=brown?l*3.5:w}
  if(!brown){const b=c.createBuffer(1,N,r);b.copyToChannel(d,0);return b}
  const o=new Float32Array(N-X);for(let i=0;i<N-X;i++)o[i]=d[i];for(let i=0;i<X;i++){const k=i/X;o[i]=d[i]*k+d[N-X+i]*(1-k)}
  const b=c.createBuffer(1,N-X,r);b.copyToChannel(o,0);return b};
 const tone=(f,d,pk,type,f2,dl)=>{if(!on)return;const t=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ub);o.start(t);o.stop(t+d+.05)};
 const sweep=(dur,f1,f2,pk)=>{if(!on)return;const t=c.currentTime,s=c.createBufferSource();s.buffer=wn;s.loop=true;const fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.1;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+dur*.4);g.gain.linearRampToValueAtTime(0,t+dur);s.connect(fl).connect(g).connect(ub);s.start(t);s.stop(t+dur+.05)};
 const startAmb=()=>{const n=c.createBufferSource();n.buffer=noise(8,true);n.loop=true;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;n.connect(lp).connect(ab);
  const ds=[55,82.4,110.3].map((f,i)=>{const o=c.createOscillator(),og=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.frequency.value=f;og.gain.value=.05/(i+1);l.frequency.value=.05+i*.03;lg.gain.value=.025/(i+1);l.connect(lg).connect(og.gain);o.connect(og).connect(ab);o.start();l.start();return[o,l]});n.start();amb={n,ds}};
 const set=v=>{soundOn=v;store.set('lab-snd',v?'on':'off');$('#snd').textContent='Sound: '+(v?'on':'off');
  if(v){if(on)return;try{c=c||new AudioContext();c.resume();ab=c.createGain();ub=c.createGain();ab.gain.value=0;ub.gain.value=vu*.8;ab.connect(c.destination);ub.connect(c.destination);wn=noise(1,false);on=true;ab.gain.linearRampToValueAtTime(va*.5,c.currentTime+2.5);startAmb();tone(523,.5,.1);tone(784,.7,.08,'sine',0,.12)}catch(x){on=false}}
  else if(on){on=false;const A=ab,U=ub,a=amb,t=c.currentTime;A.gain.cancelScheduledValues(t);A.gain.setValueAtTime(A.gain.value,t);A.gain.linearRampToValueAtTime(0,t+.4);setTimeout(()=>{try{a.n.stop();a.ds.forEach(p=>p.forEach(o=>o.stop()))}catch(x){}A.disconnect();U.disconnect()},500)}};
 $('#va').value=va;$('#vu').value=vu;$('#va').oninput=ev=>{va=+ev.target.value;store.set('lab-va',va);if(on)ab.gain.value=va*.5};$('#vu').oninput=ev=>{vu=+ev.target.value;store.set('lab-vu',vu);if(on)ub.gain.value=vu*.8};
 document.addEventListener('visibilitychange',()=>{if(c&&on)document.hidden?c.suspend():c.resume()});
 addEventListener('click',ev=>{if(ev.target.closest&&ev.target.closest('button,a,.flip'))SFX.click()},true);
 addEventListener('pointerdown',()=>{if(store.get('lab-snd')==='on'&&!soundOn)set(true)},{once:true});
 return{set,click:()=>tone(1800,.05,.1,'triangle',1100),hover:()=>tone(2400,.04,.035),blip:i=>tone(520+i*90,.14,.06,'triangle'),
  reveal:()=>{sweep(1.8,200,3200,.1);tone(110,2.2,.12,'sine',165)},whoosh:(d,rev)=>rev?sweep(d*.9,1800,300,.12):sweep(d*.9,300,1800,.12),
  arrive:()=>tone(70,.45,.18,'sine',40),open:()=>{tone(660,.25,.08);tone(990,.35,.06,'sine',0,.06)},close:()=>tone(660,.25,.07,'sine',440),chirp:()=>{tone(880,.12,.06,'triangle');tone(1320,.18,.05,'triangle',0,.1)}}})();
function sound(v){SFX.set(v)}

let introRun=0;
const scenes=k=>$$('.scene').forEach(s=>s.classList.toggle('on',s.id===k));
function finish(snd){introRun++;if(snd)sound(true);SFX.whoosh(1.2,0);const it=$('#intro');it.style.opacity=0;setTimeout(()=>{it.style.display='none'},800);$('#skip').style.display='none';
 tween({p:BASE.p,t:BASE.t},reduce?.1:1.2,()=>{state='LAB_READY'});store.set('lab-intro','seen')}
async function intro(skip){const id=++introRun;const it=$('#intro');it.style.display='flex';it.style.opacity=1;it.className='boot';$('#skip').style.display='';state='INTRO';
 cur.p.copy(BASE.p).add(V(2.5,.6,3.5));cur.t.copy(BASE.t);
 if(skip){it.className='';it.style.display='none';$('#skip').style.display='none';cur.p.copy(BASE.p);state='LAB_READY';return}
 scenes('boot');const lines=['Preparing environment','Loading laboratory modules','Initializing AIRA','Preparing developer workspace','All systems ready'];
 const bl=$('#bl'),bar=$('#bar');bl.innerHTML='<div>INITIALIZING SHIVAM’S AI LAB...</div><br>';bar.innerHTML='<i></i>'.repeat(40);
 for(let i=0;i<lines.length;i++){await sleep(450);if(id!==introRun)return;SFX.blip(i);bl.insertAdjacentHTML('beforeend',`<div><span class="ok">[ OK ]</span> ${lines[i]}</div>`);
  [...bar.children].forEach((c,j)=>c.classList.toggle('f',j<(i+1)*8))}
 await sleep(600);if(id!==introRun)return;
 it.className='reveal';scenes('name');SFX.reveal();const nm=$('#nm');nm.innerHTML='';let n=0;
 'SHIVAM SHUKLA'.split(' ').forEach((w,wi)=>{const ws=document.createElement('span');ws.className='w';ws.style.display='inline-block';[...w].forEach(ch=>{const s=document.createElement('span');s.style.setProperty('--i',n++);s.textContent=ch;ws.appendChild(s)});nm.appendChild(ws);if(!wi)nm.appendChild(document.createTextNode(' '))});
 tween({p:BASE.p,t:BASE.t},4,null);
 await sleep(3200);if(id!==introRun)return;scenes('welcome');$('#enter').focus()}
$('#enter').onclick=()=>finish(false);$('#entersnd').onclick=()=>finish(true);
$('#skip').onclick=()=>{introRun++;finish(false)};
$('#gear').onclick=()=>{const m=$('#menu'),o=m.style.display==='flex';m.style.display=o?'none':'flex';$('#gear').setAttribute('aria-expanded',!o)};
$('#replay').onclick=()=>{if(state!=='LAB_READY')return;$('#menu').style.display='none';intro(false)};
$('#snd').onclick=()=>sound(!soundOn);
$('#rst').onclick=()=>{store.del('lab-intro');$('#menu').style.display='none'};
resize();
intro(store.get('lab-intro')==='seen'&&new URLSearchParams(location.search).has('skipintro'));
</script></body></html>
